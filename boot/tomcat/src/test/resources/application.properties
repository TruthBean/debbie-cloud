debbie.tomcat.enable=true
# debbie.server.tomcat.webapp.classpath=boot/tomcat/target/test-classes

debbie.tomcat-jdbc.enable=true

debbie.datasource.driver-name=org.mariadb.jdbc.Driver
debbie.datasource.url=jdbc:mariadb://localhost:3306/test?characterEncoding=utf-8
debbie.datasource.user=root
debbie.datasource.password=root

debbie.datasource.factory=com.truthbean.debbie.tomcat.jdbc.TomcatJdbcDataSourceFactory

debbie.datasource.tomcat-jdbc.initial-size=5
debbie.datasource.tomcat-jdbc.max-active=20
debbie.datasource.tomcat-jdbc.max-idle=20
debbie.datasource.tomcat-jdbc.min-idle=5
debbie.datasource.tomcat-jdbc.max-wait=10000
debbie.datasource.tomcat-jdbc.validation-query=SELECT 1
debbie.datasource.tomcat-jdbc.test-on-borrow=true
debbie.datasource.tomcat-jdbc.time-between-eviction-runs-millis=30000