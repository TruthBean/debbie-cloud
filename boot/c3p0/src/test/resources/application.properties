debbie.datasource.driver-name=org.mariadb.jdbc.Driver
debbie.datasource.url=jdbc:mariadb://localhost:3306/test?characterEncoding=utf-8&amp;autoReconnect=true&amp;autoReconnectForPools=true
debbie.datasource.user=root
debbie.datasource.password=root

debbie.datasource.factory=com.truthbean.debbie.c3p0.C3p0DataSourceFactory

debbie.core.scan.base-packages=com.truthbean.debbie.jdbc.service

debbie.datasource.c3p0.initial-pool-size=5
debbie.datasource.c3p0.min-pool-size=5
debbie.datasource.c3p0.max-pool-size=10
debbie.datasource.c3p0.acquire-increment=3
debbie.datasource.c3p0.checkout-timeout=10000
debbie.datasource.c3p0.max-idle-time=300
debbie.datasource.c3p0.idle-connection-test-period=60
debbie.datasource.c3p0.preferred-test-query=SELECT 1
debbie.datasource.c3p0.test-connection-on-checkin=true
debbie.datasource.c3p0.data-source-name=debbie-c3p0

debbie.datasource.c3p0.x.cache-prep-stmts=true
debbie.datasource.c3p0.x.prep-stmt-cache-size=250
debbie.datasource.c3p0.x.prep-stmt-cache-sql-limit=2048
