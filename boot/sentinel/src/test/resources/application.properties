# debbie.sentinel.enable=true
debbie.sentinel.app-name=debbie-test-app
debbie.sentinel.eager=false

# log
debbie.sentinel.log-dir=
debbie.sentinel.log-name-prefix=sentinel-record
debbie.sentinel.log-use-pid=false
debbie.sentinel.charset=UTF-8

# transport / dashboard
debbie.sentinel.transport.dashboard=
debbie.sentinel.transport.port=8719
debbie.sentinel.transport.heartbeat-interval-ms=10000
debbie.sentinel.transport.client-ip=

# metric
debbie.sentinel.metric.file-size=52428800
debbie.sentinel.metric.file-count=6
debbie.sentinel.metric.flush-interval=1

# statistic
debbie.sentinel.statistic.max-rt=4900
debbie.sentinel.cold-factor=3

# system rule defaults
debbie.sentinel.system.load=-1
debbie.sentinel.system.cpu-usage=-1
debbie.sentinel.system.avg-rt=-1
debbie.sentinel.system.max-thread=-1
debbie.sentinel.system.qps=-1

# web filter
debbie.sentinel.block-page=
debbie.sentinel.filter.enabled=true
debbie.sentinel.filter.url-patterns=/*
debbie.sentinel.filter.order=-2147483648
