debbie.datasource.driver-name=org.mariadb.jdbc.Driver
debbie.datasource.url=jdbc:mariadb://localhost:3306/test?characterEncoding=utf-8&amp;autoReconnect=true&amp;autoReconnectForPools=true
debbie.datasource.user=root
debbie.datasource.password=root

debbie.datasource.factory=com.truthbean.debbie.dbcp2.Dbcp2DataSourceFactory

debbie.core.scan.base-packages=com.truthbean.debbie.jdbc.service

debbie.datasource.dbcp2.initial-size=5
debbie.datasource.dbcp2.max-total=10
debbie.datasource.dbcp2.max-idle=8
debbie.datasource.dbcp2.min-idle=5
debbie.datasource.dbcp2.max-wait-millis=10000
debbie.datasource.dbcp2.validation-query=SELECT 1
debbie.datasource.dbcp2.test-while-idle=true
debbie.datasource.dbcp2.test-on-borrow=true
debbie.datasource.dbcp2.time-between-eviction-runs-millis=60000
debbie.datasource.dbcp2.min-evictable-idle-time-millis=300000
debbie.datasource.dbcp2.cache-state=true

debbie.datasource.dbcp2.x.cache-prep-stmts=true
debbie.datasource.dbcp2.x.prep-stmt-cache-size=250
debbie.datasource.dbcp2.x.prep-stmt-cache-sql-limit=2048