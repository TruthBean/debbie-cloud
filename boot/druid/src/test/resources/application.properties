debbie.datasource.driver-name=org.mariadb.jdbc.Driver
debbie.datasource.url=jdbc:mariadb://localhost:3306/test?characterEncoding=utf-8&amp;autoReconnect=true&amp;autoReconnectForPools=true
debbie.datasource.user=root
debbie.datasource.password=root

debbie.datasource.factory=com.truthbean.debbie.druid.DruidDataSourceFactory

debbie.core.scan.base-packages=com.truthbean.debbie.jdbc.service

debbie.datasource.druid.initial-size=5
debbie.datasource.druid.min-idle=5
debbie.datasource.druid.max-active=10
debbie.datasource.druid.max-wait=10000
debbie.datasource.druid.validation-query=SELECT 1
debbie.datasource.druid.test-while-idle=true
debbie.datasource.druid.time-between-eviction-runs-millis=60000
debbie.datasource.druid.min-evictable-idle-time-millis=300000
debbie.datasource.druid.keep-alive=true
debbie.datasource.druid.async-init=true
debbie.datasource.druid.validation-query-timeout=5
debbie.datasource.druid.use-global-data-source-stat=true
debbie.datasource.druid.reset-stat-enable=true

debbie.datasource.druid.x.cache-prep-stmts=true
debbie.datasource.druid.x.prep-stmt-cache-size=250
debbie.datasource.druid.x.prep-stmt-cache-sql-limit=2048